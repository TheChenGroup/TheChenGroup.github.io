name: Check and deploy to gh-pages

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"

permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  check:
    name: Checking missing information
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run check
        id: check
        run: |
          echo 'output<<EOF' >> $GITHUB_OUTPUT
          uv run scripts/missing_info.py >> $GITHUB_OUTPUT
          echo EOF >> $GITHUB_OUTPUT
      - uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.update({
              ...context.repo,
              issue_number: 13,
              body: `${{ steps.check.outputs.output }}`
            });

  build:
    name: Build the Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy the Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
