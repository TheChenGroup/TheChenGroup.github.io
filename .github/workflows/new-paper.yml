name: Add new publication

on:
  workflow_dispatch:
    inputs:
      doi:
        description: 'DOI of the paper'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-file:
    name: Add publication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Add Publication
        run: uv run scripts/doi2yaml.py -i "${{ github.event.inputs.doi }}"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: add "${{ github.event.inputs.doi }}"
          branch: doi/${{ github.event.inputs.doi }}
          title: Add paper ${{ github.event.inputs.doi }}
          body: Automated changes by GitHub Actions
