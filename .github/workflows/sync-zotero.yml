name: Sync with Zotero

on:
  workflow_dispatch:
  schedule:
    - cron: "48 23 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-file:
    name: Sync Zotero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Sync Zotero data
        id: sync
        run: uv run scripts/sync_zotero.py
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: ${{ steps.sync.outputs.commit_message }}
          branch: paper-update/zotero
          title: ${{ steps.sync.outputs.pr_title }}
          body: ${{ steps.sync.outputs.pr_body }}
